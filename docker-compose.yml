services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vivablue
      POSTGRES_USER: vivablue
      POSTGRES_PASSWORD: ${PG_LOCAL_PASSWORD:-development-only}
    ports: ["5432:5432"]
    volumes: ["salondata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivablue"]
      interval: 5s
      retries: 10
volumes:
  salondata:
# Initialize with: cd apps/api && npm run migrate (MIGRATION_DATABASE_URL set).
# Existing volumes are never silently reinitialized.
